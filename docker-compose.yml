services:
  app:
    build: .
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=mysql://root:password@db:3306/ficha_tecnica?charset=utf8mb4
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET:-local-dev-secret-change-me}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=fichas-tecnicas
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm run dev"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
      ollama:
        condition: service_started

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=ficha_tecnica
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - .:/app # Mount to allow 'ollama create' to find Modelfile

  ollama-init:
    image: ollama/ollama:latest
    volumes:
      - .:/app
    entrypoint: /bin/sh
    command: >
      -c "
      until ollama list > /dev/null 2>&1; do echo 'Waiting for Ollama...'; sleep 5; done;
      echo 'Pulling llama3.2:3b...';
      ollama pull llama3.2:3b;
      echo 'Creating dom-ai model...';
      ollama create dom-ai -f /app/Modelfile;
      echo 'Ollama initialization complete!';
      "
    depends_on:
      - ollama

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8082:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=password
    depends_on:
      - db

volumes:
  mysql_data:
  minio_data:
  redis_data:
  ollama_data:
  app_node_modules:
