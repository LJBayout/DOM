services:
  app:
    build: .
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=mysql://root:password@db:3306/ficha_tecnica?charset=utf8mb4
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET:-local-dev-secret-change-me}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=ficha_tecnica
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8082:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=password
    depends_on:
      - db

volumes:
  mysql_data:
